name: Epic Awesome Gamer (Scheduled)

on:
  workflow_dispatch: # 手动触发
  schedule:
    # Epic 周四 08:00 太平洋时间更新：冬令时 16:00 UTC，夏令时 15:00 UTC。
    # 固定周四 16:20 UTC（北京时间周五 00:20），全年均在更新后运行。
    - cron: '20 16 * * 4'

permissions:
  contents: read

concurrency:
  group: epic-weekly-claims
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  epic-gamer:
    # Playwright 1.53 supports Ubuntu 24.04; ubuntu-latest can resolve to 26.04.
    runs-on: ubuntu-24.04
    # A single account run can take 15-20 minutes. Multi-account runs are
    # sequential, so scale the timeout with the number of accounts by setting
    # a repository variable JOB_TIMEOUT_MINUTES (Settings -> Secrets and
    # variables -> Actions -> Variables). Defaults to 60 minutes.
    timeout-minutes: ${{ fromJSON(vars.JOB_TIMEOUT_MINUTES || '60') }}

    # 默认不在主仓库自身执行定时任务；Fork 后的仓库会正常运行。
    if: github.repository != 'Ronchy2000/epic-freebies-helper'

    steps:
      - name: Check required secret presence
        env:
          EPIC_EMAIL: ${{ secrets.EPIC_EMAIL }}
          EPIC_PASSWORD: ${{ secrets.EPIC_PASSWORD }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: |
          missing=0
          for name in EPIC_EMAIL EPIC_PASSWORD GLM_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions Secret is missing: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxml2-dev libxslt-dev

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Validate hCaptcha protocol contract
        env:
          PYTHONPATH: app
        run: uv run --locked --no-dev python scripts/check_hcaptcha_contract.py

      # 增加 GITHUB_TOKEN 以降低 Camoufox 下载时的 403 频率限制。
      # 即使这里失败，运行时也可以回退到 Playwright Firefox。
      - name: Install Camoufox
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked --no-dev camoufox fetch

      - name: Install Playwright Firefox fallback
        run: uv run --locked --no-dev playwright install firefox

      - name: Run Epic Awesome Gamer
        env:
          EPIC_EMAIL: ${{ secrets.EPIC_EMAIL }}
          EPIC_PASSWORD: ${{ secrets.EPIC_PASSWORD }}
          EPIC_ACCOUNTS: ${{ secrets.EPIC_ACCOUNTS }}
          EPIC_TOTP_SECRET: ${{ secrets.EPIC_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WXPUSH_ENDPOINT: ${{ secrets.WXPUSH_ENDPOINT }}
          WXPUSH_TOKEN: ${{ secrets.WXPUSH_TOKEN }}
          WXPUSH_USERID: ${{ secrets.WXPUSH_USERID }}
          WXPUSH_TEMPLATE_ID: ${{ secrets.WXPUSH_TEMPLATE_ID }}
          WXPUSH_BASE_URL: ${{ secrets.WXPUSH_BASE_URL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || secrets.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ vars.GLM_BASE_URL || secrets.GLM_BASE_URL }}
          GLM_MODEL: ${{ vars.GLM_MODEL || secrets.GLM_MODEL }}
          CHALLENGE_CLASSIFIER_MODEL: ${{ vars.CHALLENGE_CLASSIFIER_MODEL || secrets.CHALLENGE_CLASSIFIER_MODEL }}
          IMAGE_CLASSIFIER_MODEL: ${{ vars.IMAGE_CLASSIFIER_MODEL || secrets.IMAGE_CLASSIFIER_MODEL }}
          SPATIAL_POINT_REASONER_MODEL: ${{ vars.SPATIAL_POINT_REASONER_MODEL || secrets.SPATIAL_POINT_REASONER_MODEL }}
          SPATIAL_PATH_REASONER_MODEL: ${{ vars.SPATIAL_PATH_REASONER_MODEL || secrets.SPATIAL_PATH_REASONER_MODEL }}
          BROWSER_BACKEND: auto
          BROWSER_PROXY: ${{ secrets.BROWSER_PROXY }}
          HEADLESS: virtual
          DISABLE_BEZIER_TRAJECTORY: false
          # 在 Actions 中我们依靠 GitHub 的 cron 触发，所以关闭内部调度器
          ENABLE_APSCHEDULER: false
          MPLBACKEND: Agg
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: app
        run: |
          echo "🚀 启动定时领取任务（支持 Gemini/AiHubMix/GLM）..."
          xvfb-run --auto-servernum --server-num=1 --server-args='-screen 0, 1920x1080x24' uv run --locked --no-dev app/deploy.py

      - name: Verify claim evidence and write summary
        if: success()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = Path("app/volumes/runtime/claim-verification.json")
          if not report.is_file():
              raise SystemExit("No order-history verification report; claim is NOT confirmed")
          data = json.loads(report.read_text(encoding="utf-8"))
          if data.get("verified") is not True:
              raise SystemExit("Order-history verification incomplete; claim is NOT confirmed")
          games = data.get("games", [])
          if any(game.get("status") not in {"newly_claimed", "previously_owned"} for game in games):
              raise SystemExit("Unconfirmed games remain; claim is NOT confirmed")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("## Epic order-history verification\n\n")
              stream.write("No active zero-price promotions were found.\n" if not games else "")
              for game in games:
                  title = str(game["title"]).replace("\n", " ").replace("\r", " ")
                  stream.write(f"- {title}: {game['status']}\n")
          PY

      - name: Write failure summary
        if: failure() || cancelled()
        run: |
          {
            echo "## Epic claim not confirmed"
            echo
            echo "本次未确认领取成功。检查失败步骤；邮箱、短信、Passkey 双重验证暂不受上游支持，请保留安全设置。"
            echo "遇到 Epic 24 小时领取限制时，至少等待 24 小时；不要反复重跑。"
            echo "本工作流沿用上游有限重试、60 分钟超时，并禁止重叠执行。"
            echo "为保护账号数据，不上传原始日志、截图、录像、Cookie 或浏览器配置。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: epic-verification-${{ github.run_id }}
          path: app/volumes/runtime/claim-verification.json
          if-no-files-found: ignore
          retention-days: 7
